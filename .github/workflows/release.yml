name: release

on:
  push:
    branches: [native-release-pipeline]  # TEMP: pre-merge CI dry-run; removed before tagging
    tags: ['v*']
  workflow_dispatch:

# Needed for softprops/action-gh-release to create/update the Release on tags.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest,  name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # SFML built from source needs X11/GL/freetype/udev on Linux.
      # No audio deps: the game never uses SFML::Audio.
      - name: Install Linux SFML build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libgl1-mesa-dev libfreetype-dev xvfb

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Verify no non-system dynamic deps
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            echo "== otool -L =="
            otool -L build/PacMan
            # Only third-party (Homebrew) dylibs are a problem; @rpath/@executable_path
            # tokens also appear on legitimate system frameworks, so don't flag those.
            if otool -L build/PacMan | grep -E '/usr/local/|/opt/homebrew/'; then
              echo "ERROR: binary links a non-system library — zip would not run on a clean Mac"
              exit 1
            fi
          else
            echo "== ldd =="
            ldd build/PacMan || true
          fi

      - name: Headless smoke test (Linux, from foreign CWD)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          cd /tmp
          set +e
          timeout 8 xvfb-run -a "$GITHUB_WORKSPACE/build/PacMan" > /tmp/smoke.log 2>&1
          EXIT_CODE=$?
          set -e
          echo "--- smoke.log (exit $EXIT_CODE) ---"; cat /tmp/smoke.log || true
          # 124 = timed out (game loop kept running) and 0 = clean exit are both fine;
          # anything else means it crashed on startup.
          if [ "$EXIT_CODE" -ne 124 ] && [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: binary exited with code $EXIT_CODE — possible startup crash"
            exit 1
          fi
          if grep -qi "failed to load" /tmp/smoke.log; then
            echo "ERROR: asset load failed — chdir-to-exe fix is not working"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          STAGE="PacMan-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$STAGE"
          cp build/PacMan "$STAGE"/
          cp -R build/resources "$STAGE"/
          cp README.md LICENSE "$STAGE"/ 2>/dev/null || true
          zip -r "${STAGE}.zip" "$STAGE"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "*.zip"
